<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JSONP tester – api.geogram.info</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 2rem; }
    label { display: block; margin: 0.5rem 0 0.25rem; }
    input[type=text] { width: 100%; max-width: 720px; padding: 0.5rem; }
    button { margin: 0.75rem 0.5rem 0 0; padding: 0.5rem 0.9rem; cursor: pointer; }
    pre, .muted { color:#444 }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow: auto; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 0.5rem 0.4rem; text-align: left; vertical-align: top; }
    th { font-weight: 600; }
    .right { text-align: right; }
    .rowcount { margin-top: .5rem; }
  </style>
</head>
<body>
  <h1>Test JSONP call</h1>

  <label for="url">JSONP-capable API URL:</label>
  <input id="url" type="text" value="http://api.geogram.info/search?value=Coimbra" />

  <div>
    <label><input id="auto" type="checkbox"> Auto-update every 30s</label>
    <span id="status" class="muted"></span>
  </div>

  <div style="margin-top:.5rem">
    <button id="go">Start / Fetch now</button>
    <button id="stop" title="Stop auto-update" style="display:none">Stop</button>
  </div>

  <p class="muted">Built request: <code id="built-url">—</code></p>

  <div class="rowcount muted" id="meta">—</div>

  <div id="table-wrap"></div>

  <details style="margin-top:1rem">
    <summary>Raw JSON</summary>
    <pre id="raw">—</pre>
  </details>

  <script>
    // --- Utilities ---
    function buildJsonpUrl(url, cbName) {
      const u = new URL(url, window.location.href);
      // ensure JSONP param is set to the callback we control
      u.searchParams.set("JSONP", cbName);
      // add cache-buster
      u.searchParams.set("_", Date.now().toString());
      return u.toString();
    }

    function jsonpFetch(url) {
      const cb = "jsonp_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
      const finalUrl = buildJsonpUrl(url, cb);
      document.getElementById("built-url").textContent = finalUrl;

      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        let done = false;
        const cleanup = () => {
          if (done) return;
          done = true;
          delete window[cb];
          script.remove();
          clearTimeout(tid);
        };
        window[cb] = (data) => { cleanup(); resolve(data); };
        script.onerror = () => { cleanup(); reject(new Error("Network/script error")); };
        script.src = finalUrl;
        const tid = setTimeout(() => { cleanup(); reject(new Error("Timed out waiting for JSONP")); }, 10000);
        document.body.appendChild(script);
      });
    }

    // Parse keys like "2025-08-26 13:44:25.010 UTC (Z)" -> Date
    function parseGeogramTimestamp(s) {
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})(?:\.(\d{1,3}))? UTC/i);
      if (!m) return null;
      const [ , Y, M, D, h, mnt, s2, msRaw ] = m;
      const ms = msRaw ? msRaw.padEnd(3, "0") : "000";
      const t = Date.UTC(+Y, +M - 1, +D, +h, +mnt, +s2, +ms);
      return new Date(t);
    }

    function fmtLocal(dt) {
      return dt
        ? dt.toLocaleString(undefined, { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" })
        : "—";
    }

    function timeAgo(dt) {
      if (!dt) return "";
      const diff = Date.now() - dt.getTime();
      const s = Math.round(diff / 1000);
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.round(m / 60);
      if (h < 24) return `${h}h ago`;
      const d = Math.round(h / 24);
      return `${d}d ago`;
    }

    function renderPretty(dataObj) {
      const wrap = document.getElementById("table-wrap");
      wrap.innerHTML = "";

      const entries = Object.entries(dataObj || {}).map(([ts, aprs]) => {
        const dt = parseGeogramTimestamp(ts);
        return { ts, dt, aprs };
      }).sort((a,b) => (b.dt?.getTime()||0) - (a.dt?.getTime()||0));

      const count = entries.length;
      document.getElementById("meta").textContent =
        count ? `${count} records` : "No records";

      // Build table (without original timestamp column)
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      thead.innerHTML = `<tr>
        <th>Time (local)</th>
        <th class="right">Age</th>
        <th>APRS data</th>
      </tr>`;
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (const row of entries) {
        const tr = document.createElement("tr");
        const local = fmtLocal(row.dt);
        const age = timeAgo(row.dt);
        tr.innerHTML = `
          <td>${escapeHtml(local)}</td>
          <td class="right">${escapeHtml(age)}</td>
          <td><code>${escapeHtml(row.aprs)}</code></td>
        `;
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);

      // Raw JSON
      document.getElementById("raw").textContent = JSON.stringify(dataObj, null, 2);
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    // --- App wiring ---
    const urlInput = document.getElementById("url");
    const auto = document.getElementById("auto");
    const goBtn = document.getElementById("go");
    const stopBtn = document.getElementById("stop");
    const statusEl = document.getElementById("status");

    let intervalId = null;

    async function runOnce() {
      const url = urlInput.value.trim();
      statusEl.textContent = "Loading…";
      try {
        const data = await jsonpFetch(url);
        renderPretty(data);
        statusEl.textContent = "OK " + new Date().toLocaleTimeString();
      } catch (e) {
        statusEl.textContent = "Error: " + e.message;
      }
    }

    function startAuto() {
      if (intervalId) return;
      intervalId = setInterval(runOnce, 30000);
      stopBtn.style.display = "";
      statusEl.textContent = "Auto-update: every 30s (running)";
      runOnce(); // first fetch when auto starts
    }

    function stopAuto() {
      if (intervalId) clearInterval(intervalId);
      intervalId = null;
      auto.checked = false;
      stopBtn.style.display = "none";
      statusEl.textContent = "Auto-update stopped";
    }

    auto.addEventListener("change", () => (auto.checked ? startAuto() : stopAuto()));
    goBtn.addEventListener("click", runOnce);
    stopBtn.addEventListener("click", stopAuto());

    // NOTE: No initial fetch here. User reviews/edits the URL and clicks "Start / Fetch now".
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APRS Chat Messenger v9.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #2d2d2d;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 25px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 22px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 12px;
        }
        
        .form-group {
            margin-bottom: 10px;
        }

        .form-group.compact {
            margin-bottom: 8px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: #ccc;
            font-weight: 600;
            font-size: 12px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border: 2px solid #444;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.3s;
            background: #1a1a1a;
            color: #fff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-container {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 12px;
            height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
            border: 2px solid #444;
        }

        .chat-message {
            margin-bottom: 8px;
            padding: 8px;
            background: #2d2d2d;
            border-radius: 6px;
            font-size: 13px;
            color: #fff;
        }

        .chat-message.sent {
            background: #1e4620;
            border-left: 3px solid #4CAF50;
        }

        .chat-message.system {
            background: #1a1a2e;
            border-left: 3px solid #667eea;
            color: #aaa;
            font-size: 12px;
        }

        .chat-message .timestamp {
            color: #888;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .chat-input-container {
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #444;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: #1a1a1a;
            color: #fff;
            resize: none;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .config-toggle {
            background: #444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.3s;
        }

        .config-toggle:hover {
            background: #555;
        }

        .config-section {
            display: none;
            margin-bottom: 12px;
        }

        .config-section.visible {
            display: block;
        }
        
        .info-box {
            background: #1a1a1a;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 12px;
            line-height: 1.5;
            color: #aaa;
        }

        .info-box strong {
            color: #667eea;
        }

        .info-box code {
            background: #2d2d2d;
            padding: 2px 5px;
            border-radius: 3px;
            color: #4CAF50;
        }
        
        .preset-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 5px 10px;
            background: #444;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.3s;
            color: #fff;
        }

        .preset-btn:hover {
            background: #555;
        }
        
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📻 APRS Chat Messenger v9.0</h1>
        <p class="subtitle">Real-time APRS messaging via Bell 202 AFSK 1200 baud</p>

        <button class="config-toggle" onclick="toggleConfig()">⚙️ Settings</button>

        <div id="configSection" class="config-section">
            <div class="form-group compact">
                <label for="source">Your Callsign:</label>
                <input type="text" id="source" placeholder="e.g., CR7BBQ-5" value="CR7BBQ-5">
            </div>

            <div class="form-group compact">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" placeholder="e.g., APRS or K06JZI-5" value="APRS">
            </div>

            <div class="form-group compact">
                <label for="path">Digipeater Path:</label>
                <input type="text" id="path" placeholder="e.g., WIDE1-1,WIDE2-1" value="WIDE1-1">
            </div>

            <div class="form-group compact">
                <label>Message Type:</label>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="setMessageType('message')">Direct Message</button>
                    <button class="preset-btn" onclick="setMessageType('status')">Status</button>
                    <button class="preset-btn" onclick="setMessageType('position')">Position</button>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="chat-message system">
                <div class="timestamp">System</div>
                APRS Chat ready. Type a message and press Enter or click Send.
            </div>
        </div>

        <div class="chat-input-container">
            <input type="text"
                   id="chatInput"
                   class="chat-input"
                   placeholder="Type your message..."
                   onkeydown="handleChatKeydown(event)">
            <button class="send-button" onclick="sendMessage()">Send</button>
        </div>

        <div class="info-box">
            <strong>Tips:</strong> Messages are sent immediately as APRS packets. Format: plain text for status, <code>:CALL-SSID :msg</code> for direct messages.
        </div>
    </div>
    
    <script>
        // Inline the APRS generator class
        class APRSWavGenerator {
            constructor(sampleRate = 22050) {
                this.sampleRate = sampleRate;
                this.markFreq = 1200;
                this.spaceFreq = 2200;
                this.baudRate = 1200;
                this.samplesPerBit = Math.floor(this.sampleRate / this.baudRate);
            }

            calculateFCS(data) {
                let crc = 0xFFFF;
                for (let byte of data) {
                    crc ^= byte;
                    for (let i = 0; i < 8; i++) {
                        if (crc & 0x0001) {
                            crc = (crc >> 1) ^ 0x8408;
                        } else {
                            crc = crc >> 1;
                        }
                    }
                }
                return (~crc) & 0xFFFF;
            }

            encodeCallsign(callsign, ssid = 0, isLast = false) {
                const parts = callsign.toUpperCase().split('-');
                const call = parts[0].padEnd(6, ' ');
                const actualSsid = parts[1] ? parseInt(parts[1]) : ssid;
                const encoded = [];
                
                for (let i = 0; i < 6; i++) {
                    encoded.push(call.charCodeAt(i) << 1);
                }
                
                let ssidByte = (actualSsid << 1) | 0x60;
                if (isLast) ssidByte |= 0x01;
                encoded.push(ssidByte);
                
                return encoded;
            }

            createAX25Packet(source, destination, path, message) {
                const packet = [];
                packet.push(...this.encodeCallsign(destination, 0, false));
                
                const pathArray = path ? path.split(',').filter(p => p.trim()) : [];
                const sourceIsLast = pathArray.length === 0;
                packet.push(...this.encodeCallsign(source, 0, sourceIsLast));
                
                for (let i = 0; i < pathArray.length; i++) {
                    const isLast = i === pathArray.length - 1;
                    packet.push(...this.encodeCallsign(pathArray[i].trim(), 0, isLast));
                }
                
                packet.push(0x03);
                packet.push(0xF0);
                
                for (let i = 0; i < message.length; i++) {
                    packet.push(message.charCodeAt(i));
                }
                
                return packet;
            }

            bitStuff(bits) {
                const stuffed = [];
                let consecutiveOnes = 0;
                
                for (let bit of bits) {
                    stuffed.push(bit);
                    if (bit === 1) {
                        consecutiveOnes++;
                        if (consecutiveOnes === 5) {
                            stuffed.push(0);
                            consecutiveOnes = 0;
                        }
                    } else {
                        consecutiveOnes = 0;
                    }
                }
                return stuffed;
            }

            bytesToBits(bytes) {
                const bits = [];
                for (let byte of bytes) {
                    for (let i = 0; i < 8; i++) {
                        bits.push((byte >> i) & 1);
                    }
                }
                return bits;
            }

            nrziEncode(bits) {
                const encoded = [];
                let currentLevel = 1;
                
                for (let bit of bits) {
                    if (bit === 0) {
                        currentLevel = 1 - currentLevel;
                    }
                    encoded.push(currentLevel);
                }
                return encoded;
            }

            generateAFSK(nrziBits, addVoxBeep = true) {
                const samples = [];
                let phase = 0;

                // Add VOX activation with SYNTHESIZED VOICE-LIKE SOUND
                // VOX circuits are optimized for human speech (300-3000 Hz range)
                if (addVoxBeep) {
                    const voiceDuration = 1.0; // 1 second of voice-like sound
                    const voiceSamples = Math.floor(this.sampleRate * voiceDuration);

                    // Simulate human voice by mixing multiple frequencies in speech range
                    // Human voice fundamental: 85-180 Hz (male) or 165-255 Hz (female)
                    // We'll use harmonics to create a voice-like timbre

                    let voicePhase1 = 0; // Fundamental frequency
                    let voicePhase2 = 0; // 2nd harmonic
                    let voicePhase3 = 0; // 3rd harmonic
                    let voicePhase4 = 0; // Formant-like frequency

                    const fundamental = 120; // 120 Hz fundamental (male voice range)
                    const harmonic2 = 240;   // 2nd harmonic
                    const harmonic3 = 360;   // 3rd harmonic
                    const formant = 800;     // Formant frequency (vowel-like)

                    for (let i = 0; i < voiceSamples; i++) {
                        // Create time-varying amplitude to simulate speech rhythm
                        const t = i / this.sampleRate;
                        const envelope = 0.5 + 0.5 * Math.sin(2 * Math.PI * 3 * t); // 3 Hz modulation

                        // Mix harmonics like a human voice
                        const voice1 = Math.sin(voicePhase1) * 0.4;  // Fundamental (40%)
                        const voice2 = Math.sin(voicePhase2) * 0.25; // 2nd harmonic (25%)
                        const voice3 = Math.sin(voicePhase3) * 0.15; // 3rd harmonic (15%)
                        const voice4 = Math.sin(voicePhase4) * 0.2;  // Formant (20%)

                        // Add slight noise for breathiness
                        const breathNoise = (Math.random() * 2 - 1) * 0.05;

                        // Combine all components with envelope
                        const sample = (voice1 + voice2 + voice3 + voice4 + breathNoise) * envelope * 0.95;
                        samples.push(sample);

                        // Update phases
                        voicePhase1 += (2 * Math.PI * fundamental) / this.sampleRate;
                        voicePhase2 += (2 * Math.PI * harmonic2) / this.sampleRate;
                        voicePhase3 += (2 * Math.PI * harmonic3) / this.sampleRate;
                        voicePhase4 += (2 * Math.PI * formant) / this.sampleRate;
                    }

                    // Reset phase for data transmission
                    phase = 0;
                }
                
                for (let bit of nrziBits) {
                    const freq = bit === 1 ? this.markFreq : this.spaceFreq;
                    for (let i = 0; i < this.samplesPerBit; i++) {
                        const sample = Math.sin(phase);
                        samples.push(sample);
                        phase += (2 * Math.PI * freq) / this.sampleRate;
                    }
                }
                return samples;
            }

            createWavHeader(dataLength) {
                const buffer = new ArrayBuffer(44);
                const view = new DataView(buffer);
                
                this.writeString(view, 0, 'RIFF');
                view.setUint32(4, 36 + dataLength, true);
                this.writeString(view, 8, 'WAVE');
                this.writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, 1, true);
                view.setUint32(24, this.sampleRate, true);
                view.setUint32(28, this.sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);
                this.writeString(view, 36, 'data');
                view.setUint32(40, dataLength, true);
                
                return buffer;
            }

            writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            generateWav(source, destination, path, message) {
                const preambleFlags = Array(30).fill(0x7E);
                const packet = this.createAX25Packet(source, destination, path, message);
                const fcs = this.calculateFCS(packet);
                packet.push(fcs & 0xFF);
                packet.push((fcs >> 8) & 0xFF);
                const postambleFlag = [0x7E];
                
                const preambleBits = this.bytesToBits(preambleFlags);
                const packetBits = this.bytesToBits(packet);
                const postambleBits = this.bytesToBits(postambleFlag);
                const stuffedPacketBits = this.bitStuff(packetBits);
                const allBits = [...preambleBits, ...stuffedPacketBits, ...postambleBits];
                const nrziBits = this.nrziEncode(allBits);
                const samples = this.generateAFSK(nrziBits);
                
                const pcmData = new Int16Array(samples.length);
                for (let i = 0; i < samples.length; i++) {
                    pcmData[i] = Math.round(samples[i] * 32767 * 0.8);
                }
                
                const dataLength = pcmData.length * 2;
                const header = this.createWavHeader(dataLength);
                const wavFile = new Uint8Array(44 + dataLength);
                wavFile.set(new Uint8Array(header), 0);
                wavFile.set(new Uint8Array(pcmData.buffer), 44);
                
                return wavFile;
            }
        }
        
        // Global variables
        let currentAudioBlob = null;
        let currentAudio = null;
        let currentAudioBuffer = null;
        let audioContext = null;
        const generator = new APRSWavGenerator();
        let messageType = 'status'; // default message type
        let isSending = false; // track if currently sending
        let messageQueue = []; // queue for pending messages
        let queueProcessing = false; // track if queue is being processed
        
        function toggleConfig() {
            const configSection = document.getElementById('configSection');
            configSection.classList.toggle('visible');
        }

        function setMessageType(type) {
            messageType = type;
            addSystemMessage(`Message type set to: ${type}`);
        }

        function addChatMessage(message, type = 'sent') {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${type}`;

            const timestamp = new Date().toLocaleTimeString();
            messageDiv.innerHTML = `
                <div class="timestamp">${timestamp}</div>
                ${message}
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addSystemMessage(message) {
            addChatMessage(message, 'system');
        }
        
        function sendMessage() {
            const chatInput = document.getElementById('chatInput');
            const userMessage = chatInput.value.trim();

            if (!userMessage) {
                return;
            }

            const source = document.getElementById('source').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const path = document.getElementById('path').value.trim();

            if (!source || !destination) {
                addSystemMessage('❌ Please configure your callsign and destination in Settings');
                return;
            }

            // Format message based on type
            let aprsMessage = userMessage;
            if (messageType === 'status') {
                aprsMessage = '>' + userMessage;
            } else if (messageType === 'position') {
                if (!userMessage.startsWith('!') && !userMessage.startsWith('=')) {
                    aprsMessage = '!' + userMessage;
                }
            }
            // For 'message' type, user should format it themselves with :CALLSIGN :msg

            // Add message to queue
            messageQueue.push({
                aprsMessage: aprsMessage,
                source: source,
                destination: destination,
                path: path
            });

            // Display in chat
            addChatMessage(aprsMessage);

            // Show queue status if more than 1 message
            if (messageQueue.length > 1) {
                addSystemMessage(`📤 Message queued (${messageQueue.length} pending)`);
            }

            // Clear input
            chatInput.value = '';

            // Start processing queue if not already processing
            if (!queueProcessing) {
                processMessageQueue();
            }
        }

        function processMessageQueue() {
            if (messageQueue.length === 0) {
                queueProcessing = false;
                return;
            }

            queueProcessing = true;
            const messageData = messageQueue.shift(); // Get next message from queue

            // Generate and send APRS
            isSending = true;
            try {
                const wavData = generator.generateWav(
                    messageData.source,
                    messageData.destination,
                    messageData.path,
                    messageData.aprsMessage
                );

                // Create blob
                currentAudioBlob = new Blob([wavData], { type: 'audio/wav' });

                // Initialize audio context if needed
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                // Decode and play the WAV file
                const reader = new FileReader();
                reader.onload = function(e) {
                    audioContext.decodeAudioData(e.target.result,
                        function(buffer) {
                            currentAudioBuffer = buffer;
                            playAudioBuffer();
                            isSending = false;

                            // Process next message in queue after current one finishes
                            // We need to wait for the audio to complete before processing next
                        },
                        function(error) {
                            console.error('Decode error:', error);
                            addSystemMessage(`❌ Audio decode error: ${error.message}`);
                            isSending = false;
                            // Continue with next message even if this one failed
                            setTimeout(() => processMessageQueue(), 500);
                        }
                    );
                };

                reader.onerror = function(error) {
                    console.error('FileReader error:', error);
                    addSystemMessage('❌ Error reading audio data');
                    isSending = false;
                    // Continue with next message even if this one failed
                    setTimeout(() => processMessageQueue(), 500);
                };

                reader.readAsArrayBuffer(currentAudioBlob);

            } catch (error) {
                addSystemMessage(`❌ Error: ${error.message}`);
                console.error(error);
                isSending = false;
                // Continue with next message even if this one failed
                setTimeout(() => processMessageQueue(), 500);
            }
        }
        
        function handleChatKeydown(event) {
            // Check if Enter key was pressed (keyCode 13 or key === 'Enter')
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        function playAudioBuffer() {
            if (!currentAudioBuffer || !audioContext) {
                console.error('No audio buffer available');
                return;
            }

            // ============================================================
            // EXPERIMENTATION PARAMETER:
            // ============================================================
            const DUAL_PLAY_DELAY = 0.8; // Delay before second playback (seconds)
                                         // Adjust if needed: 0.7, 0.8, 0.9, 1.0
            // ============================================================

            // DUAL PLAYBACK METHOD: Play the same audio twice with slight delay
            // This mimics your manual action of pressing play twice quickly

            // First playback - VOX activation
            const source1 = audioContext.createBufferSource();
            source1.buffer = currentAudioBuffer;
            source1.connect(audioContext.destination);

            // Second playback - starts slightly after (simulating your second button press)
            const source2 = audioContext.createBufferSource();
            source2.buffer = currentAudioBuffer;
            source2.connect(audioContext.destination);

            // Start first immediately
            source1.start(0);

            // Start second after the specified delay
            source2.start(audioContext.currentTime + DUAL_PLAY_DELAY);

            console.log('Playing dual audio streams for VOX activation');

            // When playback completes, process next message in queue
            source2.onended = function() {
                console.log('Both audio streams finished');

                // Wait a short delay before processing next message (allow VOX to reset)
                setTimeout(() => {
                    processMessageQueue();
                }, 500); // 500ms delay between messages
            };
        }
    </script>
</body>
</html>

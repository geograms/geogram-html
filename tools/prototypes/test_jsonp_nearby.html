<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nearby JSONP tester + Map</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Leaflet (no key needed) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 2rem; }
    label { display: block; margin: 0.5rem 0 0.25rem; }
    input[type=text] { width: 100%; max-width: 980px; padding: 0.5rem; }
    button { margin: 0.75rem 0.5rem 0 0; padding: 0.5rem 0.9rem; cursor: pointer; }
    pre, .muted { color:#444 }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow: auto; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 0.5rem 0.4rem; text-align: left; vertical-align: top; }
    th { font-weight: 600; }
    .right { text-align: right; }
    .rowcount { margin-top: .5rem; }
    #map { height: 60vh; margin-top: 1rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Nearby JSONP tester + Map</h1>

  <label for="url">JSONP-capable API URL:</label>
  <input id="url" type="text" value="http://api.geogram.radio/nearby?lat=40.2056&lon=-8.4196&radius=50&JSONP=x" />

  <div>
    <label><input id="auto" type="checkbox"> Auto-update every 30s</label>
    <span id="status" class="muted"></span>
  </div>

  <div style="margin-top:.5rem">
    <button id="go">Start / Fetch now</button>
    <button id="stop" title="Stop auto-update" style="display:none">Stop</button>
  </div>

  <p class="muted">Built request: <code id="built-url">—</code></p>

  <div id="map"></div>

  <div class="rowcount muted" id="meta">—</div>

  <div id="table-wrap"></div>

  <details style="margin-top:1rem">
    <summary>Raw JSON</summary>
    <pre id="raw">—</pre>
  </details>

  <script>
    // --- Map setup ---
    const defaultCenter = { lat: 40.2056, lon: -8.4196, radius: 50 };
    const map = L.map('map').setView([defaultCenter.lat, defaultCenter.lon], 12);
    const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    const markersLayer = L.layerGroup().addTo(map);
    let centerMarker = null;
    let radiusCircle = null;

    // --- JSONP utilities ---
    function buildJsonpUrl(url, cbName) {
      const u = new URL(url, window.location.href);
      // Always force JSONP callback param we control (overrides any existing like &JSONP=x)
      u.searchParams.set("JSONP", cbName);
      // Cache-buster
      u.searchParams.set("_", Date.now().toString());
      return u.toString();
    }

    function jsonpFetch(url) {
      const cb = "jsonp_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
      const finalUrl = buildJsonpUrl(url, cb);
      document.getElementById("built-url").textContent = finalUrl;

      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        let done = false;
        const cleanup = () => {
          if (done) return;
          done = true;
          delete window[cb];
          script.remove();
          clearTimeout(tid);
        };
        window[cb] = (data) => { cleanup(); resolve(data); };
        script.onerror = () => { cleanup(); reject(new Error("Network/script error")); };
        script.src = finalUrl;
        const tid = setTimeout(() => { cleanup(); reject(new Error("Timed out waiting for JSONP")); }, 10000);
        document.body.appendChild(script);
      });
    }

    // --- Time helpers ---
    function fmtLocal(dt) {
      return dt
        ? dt.toLocaleString(undefined, { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" })
        : "—";
    }
    function timeAgo(dt) {
      if (!dt) return "";
      const diff = Date.now() - dt.getTime();
      const s = Math.round(diff / 1000);
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.round(m / 60);
      if (h < 24) return `${h}h ago`;
      const d = Math.round(h / 24);
      return `${d}d ago`;
    }

    // --- UI helpers ---
    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    // --- Rendering ---
    function renderTable(devices) {
      const wrap = document.getElementById("table-wrap");
      wrap.innerHTML = "";

      const entries = (Array.isArray(devices) ? devices : []).slice().sort((a, b) => {
        const at = a.updated || 0, bt = b.updated || 0;
        return bt - at; // newest first
      });

      document.getElementById("meta").textContent =
        entries.length ? `${entries.length} stations` : "No stations";

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      thead.innerHTML = `<tr>
        <th>Station</th>
        <th class="right">Distance (km)</th>
        <th>Updated (local)</th>
        <th class="right">Age</th>
        <th>Lat</th>
        <th>Lon</th>
      </tr>`;
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (const d of entries) {
        const dt = d.updated ? new Date(Number(d.updated)) : null;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(d.id ?? "—")}</td>
          <td class="right">${Number.isFinite(d.distance) ? d.distance.toFixed(1) : "—"}</td>
          <td>${escapeHtml(fmtLocal(dt))}</td>
          <td class="right">${escapeHtml(timeAgo(dt))}</td>
          <td>${escapeHtml(d.lat)}</td>
          <td>${escapeHtml(d.lon)}</td>
        `;
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);

      // Raw JSON
      document.getElementById("raw").textContent = JSON.stringify(devices, null, 2);
    }

    function parseCenterFromUrl(url) {
      const u = new URL(url, window.location.href);
      const lat = parseFloat(u.searchParams.get("lat")) || defaultCenter.lat;
      const lon = parseFloat(u.searchParams.get("lon")) || defaultCenter.lon;
      const radius = parseFloat(u.searchParams.get("radius")) || defaultCenter.radius; // km
      return { lat, lon, radius };
    }

    function updateMap(devices, url) {
      const center = parseCenterFromUrl(url);

      // Clear old layers
      markersLayer.clearLayers();
      if (centerMarker) map.removeLayer(centerMarker);
      if (radiusCircle) map.removeLayer(radiusCircle);

      // Center marker + radius (meters)
      centerMarker = L.marker([center.lat, center.lon]).addTo(map)
        .bindPopup(`<strong>Center</strong><br/>lat ${center.lat.toFixed(5)}<br/>lon ${center.lon.toFixed(5)}<br/>radius ${center.radius} km`);
      radiusCircle = L.circle([center.lat, center.lon], { radius: center.radius * 1000 }).addTo(map);

      // Device markers
      const bounds = [];
      bounds.push([center.lat, center.lon]);
      if (Array.isArray(devices)) {
        for (const d of devices) {
          if (typeof d.lat !== "number" || typeof d.lon !== "number") continue;
          const marker = L.marker([d.lat, d.lon]).addTo(markersLayer);
          const dt = d.updated ? new Date(Number(d.updated)) : null;
          marker.bindPopup(
            `<strong>${escapeHtml(d.id ?? "Station")}</strong><br/>
             Distance: ${Number.isFinite(d.distance) ? d.distance.toFixed(1) : "—"} km<br/>
             Updated: ${escapeHtml(fmtLocal(dt))} (${escapeHtml(timeAgo(dt))})<br/>
             Lat: ${escapeHtml(d.lat)}<br/>
             Lon: ${escapeHtml(d.lon)}`
          );
          bounds.push([d.lat, d.lon]);
        }
      }

      if (bounds.length >= 2) {
        map.fitBounds(bounds, { padding: [20, 20] });
      } else {
        map.setView([center.lat, center.lon], 12);
      }
    }

    // --- App wiring ---
    const urlInput = document.getElementById("url");
    const auto = document.getElementById("auto");
    const goBtn = document.getElementById("go");
    const stopBtn = document.getElementById("stop");
    const statusEl = document.getElementById("status");

    let intervalId = null;

    async function runOnce() {
      const url = urlInput.value.trim();
      statusEl.textContent = "Loading…";
      try {
        const data = await jsonpFetch(url); // expected: Array<{lat,lon,distance,id,updated,updatedReadable}>
        renderTable(data);
        updateMap(data, url);
        statusEl.textContent = "OK " + new Date().toLocaleTimeString();
      } catch (e) {
        statusEl.textContent = "Error: " + e.message;
      }
    }

    function startAuto() {
      if (intervalId) return;
      intervalId = setInterval(runOnce, 30000);
      stopBtn.style.display = "";
      statusEl.textContent = "Auto-update: every 30s (running)";
      runOnce(); // fetch immediately when auto starts
    }

    function stopAuto() {
      if (intervalId) clearInterval(intervalId);
      intervalId = null;
      auto.checked = false;
      stopBtn.style.display = "none";
      statusEl.textContent = "Auto-update stopped";
    }

    auto.addEventListener("change", () => (auto.checked ? startAuto() : stopAuto()));
    goBtn.addEventListener("click", runOnce);
    stopBtn.addEventListener("click", stopAuto);

    // NOTE: No initial fetch. Edit URL and click "Start / Fetch now".
  </script>
</body>
</html>

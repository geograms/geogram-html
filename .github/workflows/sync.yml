name: sync

# Keep geogram.radio in sync with the source repos — no deploy keys / secrets,
# only the automatic GITHUB_TOKEN (write to THIS repo; read public source repos).
#
#   wapps/    <- geograms/wapps : binaries/ (committed .wapp catalog), copied
#   updates/  <- geograms/aurora GitHub *Release assets* (binaries are NOT in the
#               aurora git repo — they're release assets, so the source repo stays
#               lean). This job downloads them and builds the feed JSON here.
#
# Pushing this repo publishes it (GitHub Pages -> geogram.radio).

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}   # for `gh` (read public releases)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website (this repo)
        uses: actions/checkout@v4

      - name: Checkout wapps source
        uses: actions/checkout@v4
        with:
          repository: geograms/wapps
          path: .src/wapps

      - name: Sync wapp store catalog
        run: |
          if [ -f .src/wapps/binaries/index.json ]; then
            mkdir -p wapps
            rsync -a --delete --exclude README.md .src/wapps/binaries/ wapps/
            echo "synced wapps: $(grep -c '"file"' wapps/index.json) entries"
          else
            echo "no wapps/binaries/index.json — skipping wapps"
          fi

      - name: Sync update feed from aurora releases
        run: |
          set -e
          mkdir -p updates
          # The update feed points at the binaries hosted as GitHub *Release
          # assets* (absolute asset.url). We do NOT copy them into this repo:
          # the APK exceeds GitHub's 100 MB per-file blob limit, which rejects
          # the whole push. The website download page reads the GitHub API
          # directly; the in-app updater fetches over Reticulum. This feed is
          # just a self-hosted mirror of the latest tags with download URLs.
          gen() {  # $1 = tag (e.g. v1.0.3)   $2 = output json
            local tag="$1" out="$2"
            [ -z "$tag" ] && return 0
            gh release view "$tag" -R geograms/aurora \
              --json tagName,name,body,publishedAt,isPrerelease,assets \
              --jq '{
                version: (.tagName | ltrimstr("v")),
                tagName: .tagName,
                name: .name,
                body: (.body // ""),
                publishedAt: .publishedAt,
                prerelease: .isPrerelease,
                assets: [.assets[] | {name: .name, url: .url, size: .size}]
              }' > "$out"
            echo "wrote $out ($tag)"
          }
          # Channel tags from aurora's GitHub Releases.
          STABLE=$(gh release list -R geograms/aurora --exclude-drafts -L 50 \
                     --json tagName,isPrerelease \
                     --jq 'map(select(.isPrerelease|not))|.[0].tagName // ""')
          BETA=$(gh release list -R geograms/aurora --exclude-drafts -L 1 \
                   --json tagName --jq '.[0].tagName // ""')
          echo "latest stable=$STABLE  latest (beta)=$BETA"
          if [ -z "$STABLE" ] && [ -z "$BETA" ]; then
            echo "no releases yet — nothing to publish"; exit 0
          fi
          [ -n "$STABLE" ] && gen "$STABLE" updates/stable.json
          # Beta channel tracks the newest build (falls back to stable).
          gen "${BETA:-$STABLE}" updates/beta.json
          # Drop any previously-committed in-repo binary dirs (over the 100 MB
          # limit) — the feed now references the release assets directly.
          git rm -r --quiet --ignore-unmatch 'updates/v*' 2>/dev/null || true
          rm -rf updates/v*

      - name: Clean up checkouts
        run: rm -rf .src

      - name: Commit & push if changed
        run: |
          git config user.name 'geogram-sync'
          git config user.email 'sync@geogram.radio'
          git add wapps updates
          if git diff --cached --quiet; then
            echo "nothing to sync"
          else
            git commit -m "sync: wapps catalog + update feed from source repos"
            git push
          fi
